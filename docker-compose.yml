services:
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped

    # Bind to localhost by default.
    ports:
      - "127.0.0.1:${N8N_PORT:-5678}:5678"

    environment:
      - N8N_PORT=5678
      - N8N_PROTOCOL=${N8N_PROTOCOL:-http}
      - N8N_HOST=${N8N_HOST:-localhost}
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-Asia/Dubai}
      - TZ=${GENERIC_TIMEZONE:-Asia/Dubai}

    volumes:
      - ./data/n8n:/home/node/.n8n

    healthcheck:
      test:
        - CMD-SHELL
        - "wget -q -O - http://127.0.0.1:5678/healthz >/dev/null 2>&1 || exit 1"
      interval: 30s
      timeout: 5s
      retries: 5
